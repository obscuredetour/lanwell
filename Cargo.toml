[workspace]
resolver = "3"
members = ["crates/*"]

# One version for the app and every crate: bump it here (and in
# crates/app/ui/package.json) for a release. tauri.conf.json takes it from here.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
debug = "line-tables-only"
