<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The logo (logo.svg) on a tile. The violets come from the UI's accent
       (#7438a8, and #bf97ed / #1b1030 in the dark theme, styles.css). -->
