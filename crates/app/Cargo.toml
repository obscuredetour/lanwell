[package]
name = "lanwell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Share folders and mount network shares, without the command line"
publish = false

[dependencies]
lanwell-core = { path = "../core", features = ["ts"] }
mdns-sd = "0.21.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = { version = "2", default-features = false }
# Checking for a new release (one small request a day); rustls, so no OpenSSL.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
