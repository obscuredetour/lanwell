[package]
name = "lanwell-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lanwell's model of shares, the requests the helper accepts, and the config files it writes"
publish = false

[features]
# Export TypeScript bindings for UI-facing types (used by the app).
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
