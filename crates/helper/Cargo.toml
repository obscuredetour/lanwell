[package]
name = "netfoo-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "netfoo's privileged helper: applies the app's requests as root, once polkit allows them"
publish = false

[dependencies]
netfoo-core = { path = "../core" }
serde_json = "1.0.151"
thiserror = "2.0.21"

[target.'cfg(target_os = "linux")'.dependencies]
# geteuid, for `install` to check it's running as root.
libc = "0.2.190"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3.27.0"
