<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may use the helper's bus name. Only root may own it; anyone may call it,
  because every call is checked with polkit before anything is changed.
-->
<busconfig>
  <policy user="root">
    <allow own="io.netfoo.Helper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.netfoo.Helper1"
           send_interface="io.netfoo.Helper1"/>
    <allow send_destination="io.netfoo.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.netfoo.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.netfoo.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
